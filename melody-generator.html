<title>無限ヒーリングピアノ</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --surface: #14181c;
    --surface-2: #1a1f25;
    --line: #262c33;
    --line-strong: #39424b;
    --text: #e7e6e3;
    --muted: #98a0a8;
    --accent: #a9c8d8;
    --accent-ink: #0b0d10;
    --radius: 10px;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
      "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(48px, 10vw, 96px) clamp(20px, 5vw, 32px) 96px;
  }

  /* ---- 見出し ---- */

  .site-head { text-align: center; }

  h1 {
    margin: 0;
    font-size: clamp(1.35rem, 4.5vw, 1.7rem);
    font-weight: 500;
    letter-spacing: 0.16em;
  }

  .lede {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.06em;
  }

  h2 {
    margin: 0 0 20px;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--muted);
  }

  main > section { margin-top: clamp(48px, 10vw, 76px); }

  /* ---- ボタン共通 ---- */

  button {
    font: inherit;
    font-size: 0.88rem;
    letter-spacing: 0.06em;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  button:hover {
    border-color: var(--line-strong);
    color: #fff;
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ---- 再生（主役） ---- */

  .stage { text-align: center; }

  #play-toggle {
    display: block;
    width: min(100%, 320px);
    margin: 0 auto;
    padding: 20px 24px;
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    color: var(--accent-ink);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    transition: opacity 0.2s ease;
  }

  #play-toggle:hover {
    opacity: 0.88;
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  #play-toggle[aria-pressed="true"],
  #play-toggle.is-playing {
    color: var(--accent);
    background: transparent;
  }

  .hint {
    margin: 20px auto 0;
    max-width: 30em;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.9;
  }

  .transport {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #now-playing {
    margin-top: 32px;
    min-height: 1.9em;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    overflow-wrap: anywhere;
  }

  /* ---- 曲コード ---- */

  .code-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  #song-code {
    flex: 1 1 200px;
    min-width: 0;
    padding: 9px 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
  }

  #song-code:read-only { cursor: text; }

  .note {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 0.78rem;
  }

  #status {
    margin-top: 20px;
    min-height: 1.7em;
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    overflow-wrap: anywhere;
  }

  /* ---- 設定パネル（src/ui.js が組み立てる） ---- */

  .settings {
    display: grid;
    gap: 10px;
  }

  .settings-pending {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    font-size: 0.8rem;
  }

  .settings-pending[hidden] { display: none; }

  .settings-rebuild {
    padding: 6px 14px;
    font-size: 0.8rem;
    background: transparent;
  }

  .settings-group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .settings-group-title {
    padding: 14px 18px;
    font-size: 0.88rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    cursor: pointer;
  }

  .settings-group[open] > .settings-group-title { color: var(--text); }

  .settings-fields {
    display: grid;
    gap: 24px;
    padding: 8px 18px 24px;
  }

  .field {
    display: grid;
    gap: 10px;
    min-width: 0;
  }

  .field-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .field-label {
    font-size: 0.88rem;
    color: var(--muted);
  }

  .field-value {
    font-size: 0.82rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .field-range .field-input {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .field-toggle .field-head { align-items: center; }

  .field-toggle .field-input {
    flex: none;
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .field-choice .field-input {
    width: 100%;
    padding: 9px 12px;
    font: inherit;
    font-size: 0.86rem;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .settings-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 6px;
  }

  .settings-reset {
    font-size: 0.8rem;
    color: var(--muted);
    background: transparent;
  }

  /* ---- フッタ ---- */

  .site-foot {
    margin-top: clamp(56px, 12vw, 88px);
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    letter-spacing: 0.06em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

  function handleSongChange(song) {
    if (!song) return;
    const code = encodeSongCode(song.seed, settings);
    setFieldValue(els.songCode, code);

    // リロードしても同じ曲に戻れるようにハッシュを合わせる。
    // 履歴を汚さないよう replaceState を優先する（URL の見た目は同じ）。
    try {
      const { history, location } = globalThis;
      if (history?.replaceState) {
        history.replaceState(null, '', `${location.pathname}${location.search}#${code}`);
      } else if (location) {
        location.hash = code;
      }
    } catch (err) {
      console.warn('URL ハッシュを更新できませんでした', err);
    }

    if (els.nowPlaying) els.nowPlaying.textContent = describeSong(song);
  }

  // ---- 設定パネル ------------------------------------------------------
  if (els.settingsPanel) {
    panel = createSettingsPanel(els.settingsPanel, {
      settings,
      onChange(key, value, next) {
        settings = normalizeSettings(next);
        storeSettings(settings);
        // サウンド系だけは鳴っている最中でも即座に反映する。
        // 作曲・演奏系は曲の組み立て時にすでに使われているので次の曲から。
        if (DEF_BY_KEY.get(key)?.apply === 'live' && player) {
          player.applySettings(settings);
        }
      },
      onRebuild() {
        // 同じシードのまま、新しい設定で作り直す
        const seed = player?.getCurrentSong()?.seed ?? pendingSeed ?? undefined;
        startPlayback(seed);
      },
    });
  }

  // ---- ボタン ----------------------------------------------------------
  const gatedButtons = [els.playToggle, els.skip, els.loadCode].filter(Boolean);
  for (const button of gatedButtons) button.disabled = true;

  setPlayLabel(false);

  if (els.playToggle) {
    els.playToggle.addEventListener('click', () => {
      if (player?.isPlaying()) {
        player.stop();
        setPlayLabel(false);
        return;
      }
      const seed = pendingSeed;
      pendingSeed = null;
      startPlayback(seed);
    });
  }

  if (els.skip) {
    els.skip.addEventListener('click', () => {
      if (player?.isPlaying()) {
        player.skip();
        return;
      }
      // 停止中に押されたら、そのまま新しい曲で再生を始める
      pendingSeed = null;
      startPlayback();
    });
  }

  if (els.copyCode) {
    els.copyCode.addEventListener('click', async () => {
      const code = getFieldValue(els.songCode);
      if (!code) {
        setStatus('コピーする曲コードがまだありません', 2000);
        return;
      }
      const clipboard = globalThis.navigator?.clipboard;
      if (clipboard?.writeText) {
        try {
          await clipboard.writeText(code);
          setStatus('コピーしました', 1500);
          return;
        } catch (err) {
          console.warn('クリップボードへの書き込みに失敗しました', err);
        }
      }
      // http:// や古いブラウザではクリップボード API が使えない。
      // 選択状態にして、手でコピーしてもらう。
      try {
        els.songCode?.focus?.();
        els.songCode?.select?.();
      } catch (err) {
        console.warn('曲コードを選択できませんでした', err);
      }
      setStatus('コピーできませんでした。選択してあるので Ctrl+C を押してください', 4000);
    });
  }

  if (els.loadCode) {
    els.loadCode.addEventListener('click', () => {
      const raw = getFieldValue(els.songCode);
      if (!raw) {
        setStatus('曲コードを入力してください', 2500);
        return;
      }
      const decoded = decodeSongCode(raw);
      if (!decoded.seed) {
        setStatus('曲コードが正しくありません', 3000);
        return;
      }
      // 作曲パラメータだけ取り込む。音量やリバーブは今の設定のまま。
      settings = normalizeSettings({
        ...settings,
        ...pickComposeParams(decoded.settings),
      });
      storeSettings(settings);
      panel?.setSettings(settings);
      panel?.clearPending();
      if (player) player.applySettings(settings);
      pendingSeed = null;
      setStatus('曲コードを読み込みました', 2000);
      startPlayback(decoded.seed);
    });
  }

  // ---- データ読み込み --------------------------------------------------
  setStatus('データを読み込んでいます…');
  Promise.all([fetchJson(MELODIES_URL), fetchJson(PROGRESSIONS_URL)])
    .then(([melodies, progressions]) => {
      if (!Array.isArray(melodies) || melodies.length === 0) {
        throw new Error('melodies.json の中身が配列ではありません');
      }
      if (!Array.isArray(progressions) || progressions.length === 0) {
        throw new Error('progressions.json の中身が配列ではありません');
      }
      data = { melodies, progressions };
      for (const button of gatedButtons) button.disabled = false;
      setStatus('');
    })
    .catch((err) => {
      console.error(err);
      // 黙って壊れないこと。原因（file:// 直開きが多い）まで出す。
      for (const button of gatedButtons) button.disabled = true;
      setPlayLabel(false);
      setStatus(
        `データを読み込めませんでした（${err.message}）。` +
          'ローカルサーバー経由で開いてください（npm start）。',
      );
    });
}

// type="module" は defer 相当なので、この時点の readyState は 'interactive'。
// DOMContentLoaded はまだ来ていないので待てる。動的 import などで 'complete' に
// なってから読み込まれた場合はもう来ないので、その場で起動する。
if (document.readyState === 'complete') {
  init();
} else {
  document.addEventListener('DOMContentLoaded', init, { once: true });
}
};

// --- 起動 ---
__req("main.js");
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="静かなピアノ曲を、途切れることなく生成し続けます。">
<title>無限ヒーリングピアノ</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --surface: #14181c;
    --surface-2: #1a1f25;
    --line: #262c33;
    --line-strong: #39424b;
    --text: #e7e6e3;
    --muted: #98a0a8;
    --accent: #a9c8d8;
    --accent-ink: #0b0d10;
    --radius: 10px;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
      "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(48px, 10vw, 96px) clamp(20px, 5vw, 32px) 96px;
  }

  /* ---- 見出し ---- */

  .site-head { text-align: center; }

  h1 {
    margin: 0;
    font-size: clamp(1.35rem, 4.5vw, 1.7rem);
    font-weight: 500;
    letter-spacing: 0.16em;
  }

  .lede {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.06em;
  }

  h2 {
    margin: 0 0 20px;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--muted);
  }

  main > section { margin-top: clamp(48px, 10vw, 76px); }

  /* ---- ボタン共通 ---- */

  button {
    font: inherit;
    font-size: 0.88rem;
    letter-spacing: 0.06em;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  button:hover {
    border-color: var(--line-strong);
    color: #fff;
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ---- 再生（主役） ---- */

  .stage { text-align: center; }

  #play-toggle {
    display: block;
    width: min(100%, 320px);
    margin: 0 auto;
    padding: 20px 24px;
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    color: var(--accent-ink);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    transition: opacity 0.2s ease;
  }

  #play-toggle:hover {
    opacity: 0.88;
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  #play-toggle[aria-pressed="true"],
  #play-toggle.is-playing {
    color: var(--accent);
    background: transparent;
  }

  .hint {
    margin: 20px auto 0;
    max-width: 30em;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.9;
  }

  .transport {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #now-playing {
    margin-top: 32px;
    min-height: 1.9em;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    overflow-wrap: anywhere;
  }

  /* ---- 曲コード ---- */

  .code-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  #song-code {
    flex: 1 1 200px;
    min-width: 0;
    padding: 9px 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
  }

  #song-code:read-only { cursor: text; }

  .note {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 0.78rem;
  }

  #status {
    margin-top: 20px;
    min-height: 1.7em;
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    overflow-wrap: anywhere;
  }

  /* ---- 設定パネル（src/ui.js が組み立てる） ---- */

  .settings {
    display: grid;
    gap: 10px;
  }

  .settings-pending {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    font-size: 0.8rem;
  }

  .settings-pending[hidden] { display: none; }

  .settings-rebuild {
    padding: 6px 14px;
    font-size: 0.8rem;
    background: transparent;
  }

  .settings-group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .settings-group-title {
    padding: 14px 18px;
    font-size: 0.88rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    cursor: pointer;
  }

  .settings-group[open] > .settings-group-title { color: var(--text); }

  .settings-fields {
    display: grid;
    gap: 24px;
    padding: 8px 18px 24px;
  }

  .field {
    display: grid;
    gap: 10px;
    min-width: 0;
  }

  .field-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .field-label {
    font-size: 0.88rem;
    color: var(--muted);
  }

  .field-value {
    font-size: 0.82rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .field-range .field-input {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .field-toggle .field-head { align-items: center; }

  .field-toggle .field-input {
    flex: none;
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .field-choice .field-input {
    width: 100%;
    padding: 9px 12px;
    font: inherit;
    font-size: 0.86rem;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .settings-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 6px;
  }

  .settings-reset {
    font-size: 0.8rem;
    color: var(--muted);
    background: transparent;
  }

  /* ---- フッタ ---- */

  .site-foot {
    margin-top: clamp(56px, 12vw, 88px);
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    letter-spacing: 0.06em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="site-head">
    <h1>無限ヒーリングピアノ</h1>
    <p class="lede">静かなピアノ曲を、途切れることなく作り続けます。</p>
  </header>

  <main>

    <section class="stage" aria-label="再生">
      <button id="play-toggle" type="button" aria-pressed="false">▶ 再生する</button>
      <p class="hint">
        ブラウザの決まりで、最初のクリックがあるまで音は鳴りません。<br>
        このボタンを押した瞬間に、一曲目が生まれます。
      </p>
      <div class="transport">
        <button id="skip" type="button">次の曲へ</button>
      </div>
      <div id="now-playing" aria-live="polite">まだ再生していません</div>
    </section>

    <section aria-labelledby="code-head">
      <h2 id="code-head">曲コード</h2>
      <div class="code-row">
        <input id="song-code" type="text" readonly aria-label="現在の曲コード"
               placeholder="再生するとここに出ます">
        <button id="copy-code" type="button">コピー</button>
        <button id="load-code" type="button">読み込む</button>
      </div>
      <p class="note">同じコードを読み込めば、同じ曲がもう一度流れます。</p>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section aria-labelledby="settings-head">
      <h2 id="settings-head">設定</h2>
      <div id="settings-panel"></div>
    </section>

  </main>

  <footer class="site-foot">
    音は毎回その場で生まれています。同じ曲は、コードを控えないと二度と聴けません。
  </footer>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>

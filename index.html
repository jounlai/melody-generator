<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="静かなピアノ曲を、途切れることなく生成し続けます。">
<title>無限ヒーリングピアノ</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --surface: #14181c;
    --surface-2: #1a1f25;
    --line: #262c33;
    --line-strong: #39424b;
    --text: #e7e6e3;
    --muted: #98a0a8;
    --accent: #a9c8d8;
    --accent-ink: #0b0d10;
    --radius: 10px;
    /* アイコンはすべてこの太さで描く。線の太さが揃っていないと、
       同じ列に並べたときに「別の場所から持ってきた絵」に見える */
    --stroke: 1.6;
    /* 文字の段は4つだけ。近い大きさを何段も置くと、どれが上位なのか
       読む側に伝わらない（0.7 → 0.875 → 1 → 1.5rem）。
       入力欄の 16px は iOS が勝手に拡大しないための下限で、動かせない。 */
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    /* 楽譜はこの中の枠だけが横に流れる。ページ全体は決して横に伸びない */
    overflow-x: clip;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
      "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 64px) clamp(16px, 4vw, 32px)
      calc(28px + env(safe-area-inset-bottom, 0px));
  }

  /* ---- 癒しのアニメーション ----
   *
   * 再生中だけ、ゆっくり呼吸する光を置く。速い動きは癒しの逆なので、
   * 周期は 6〜26 秒。人の安静時の呼吸が4〜6秒で、それより速いものが
   * 視界にあると身体は休まらない。
   *
   * 動かすのは transform と opacity と filter だけに絞る（合成だけで済み、
   * 毎フレームのレイアウト計算が起きない）。止まっているときは
   * アニメーションを一切走らせず、opacity 0 で消す。
   */
  .ambient {
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  body[data-playing="true"] .ambient { opacity: 1; }

  .ambient i {
    position: absolute;
    display: block;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0;
  }

  .ambient i:nth-child(1) {
    left: 8%; top: 6%; width: 46vmax; height: 46vmax;
    background: radial-gradient(circle, rgb(169 200 216 / 22%), transparent 70%);
  }

  .ambient i:nth-child(2) {
    right: 4%; top: 34%; width: 38vmax; height: 38vmax;
    background: radial-gradient(circle, rgb(150 176 200 / 18%), transparent 70%);
  }

  .ambient i:nth-child(3) {
    left: 24%; bottom: 2%; width: 42vmax; height: 42vmax;
    background: radial-gradient(circle, rgb(190 205 200 / 14%), transparent 70%);
  }

  body[data-playing="true"] .ambient i:nth-child(1) { animation: drift 26s ease-in-out infinite alternate; }
  body[data-playing="true"] .ambient i:nth-child(2) { animation: drift 34s ease-in-out -12s infinite alternate-reverse; }
  body[data-playing="true"] .ambient i:nth-child(3) { animation: drift 30s ease-in-out -6s infinite alternate; }

  @keyframes drift {
    from { opacity: 0.35; transform: translate3d(-4%, 2%, 0) scale(0.95); }
    to   { opacity: 0.9;  transform: translate3d(5%, -3%, 0) scale(1.12); }
  }

  /* 再生ボタンの後ろで広がって消える波紋。呼吸のリズムそのもの */
  .stage { position: relative; text-align: center; }

  .pulse {
    position: absolute;
    z-index: 0;
    top: 50%;
    left: 50%;
    width: 84px;
    height: 84px;
    margin: -42px 0 0 -42px;
    pointer-events: none;
  }

  .pulse i {
    position: absolute;
    inset: 0;
    display: block;
    border: 1px solid var(--accent);
    border-radius: 50%;
    opacity: 0;
  }

  body[data-playing="true"] .pulse i { animation: ripple 6s ease-out infinite; }
  body[data-playing="true"] .pulse i:nth-child(2) { animation-delay: 2s; }
  body[data-playing="true"] .pulse i:nth-child(3) { animation-delay: 4s; }

  @keyframes ripple {
    0%   { opacity: 0.45; transform: scale(1); }
    100% { opacity: 0;    transform: scale(2.15); }
  }

  /* ---- 見出し ---- */

  .site-head { text-align: center; }

  h1 {
    margin: 0 0 clamp(18px, 5vw, 32px);
    font-size: clamp(1.2rem, 4.5vw, 1.5rem);
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  /* ---- ボタン共通 ---- */

  button {
    font: inherit;
    font-size: 0.875rem;
    letter-spacing: 0.06em;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }

  button:hover:not(:disabled) {
    border-color: var(--line-strong);
    color: #fff;
  }

  button:disabled { opacity: 0.35; cursor: default; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* 線で描くアイコンは太さと端の形を1か所で決める */
  .ico {
    flex: none;
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: var(--stroke);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---- 再生 ---- */

  .transport {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 8vw, 40px);
  }

  .transport-btn,
  .transport-play {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 999px;
    transition: border-color 0.2s ease, background-color 0.2s ease,
      color 0.2s ease, transform 0.12s ease, opacity 0.2s ease;
  }

  /* 再生・前後は塗りのアイコン。線のアイコン（道具）と役割で描き分ける */
  .transport-btn svg,
  .transport-play svg {
    width: 40%;
    height: 40%;
    fill: currentColor;
  }

  .transport-btn {
    width: 52px;
    height: 52px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
  }

  .transport-btn:hover:not(:disabled) {
    color: var(--text);
    border-color: var(--line-strong);
  }

  .transport-play {
    width: 84px;
    height: 84px;
    color: var(--accent-ink);
    background: var(--accent);
    border: 1px solid var(--accent);
    box-shadow: 0 10px 30px -12px rgb(169 200 216 / 55%);
  }

  .transport-play:hover:not(:disabled) { opacity: 0.9; }

  /* 停止中と再生中で、塗りと輪郭を入れ替える。
     hover もここで書き切る。押した直後はカーソルがボタンの上に残るので、
     上の :hover が勝つとアイコンが地の色になって消える。 */
  .transport-play[data-state="playing"],
  .transport-play[data-state="playing"]:hover:not(:disabled) {
    color: var(--accent);
    background: transparent;
    box-shadow: none;
    opacity: 1;
  }

  .transport-play[data-state="playing"]:hover:not(:disabled) {
    background: rgb(169 200 216 / 12%);
  }

  .transport-play .icon-pause,
  .transport-play[data-state="playing"] .icon-play { display: none; }
  .transport-play[data-state="playing"] .icon-pause { display: block; }

  /* 三角は丸の中で重心が左に寄って見える。1px 右へ置いて中心を合わせる */
  .transport-play .icon-play { transform: translateX(1px); }

  .transport-btn:active:not(:disabled),
  .transport-play:active:not(:disabled) { transform: scale(0.94); }

  #now-playing {
    margin: clamp(16px, 4vw, 24px) 0 0;
    min-height: 1.7em;
    color: var(--muted);
    font-size: 0.875rem;
    letter-spacing: 0.06em;
    overflow-wrap: anywhere;
  }

  /* ---- 楽譜 ---- */

  /* ページの左右余白ぶんだけ外へ広げて、楽譜を一番大きく見せる。
     100vw ではなく余白の実寸を打ち消しているので、横スクロールは生まれない。 */
  .score-section {
    margin: clamp(18px, 5vw, 28px) calc(-1 * clamp(16px, 4vw, 32px)) 0;
  }

  #score-view {
    /* 楽譜の線と符頭の色。notation.js は currentColor と --score-ink を見る */
    --score-ink: #d5dce2;
    position: relative;
    display: flex;
    align-items: center;
    min-height: clamp(150px, 24vh, 260px);
    color: var(--score-ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-inline: 0;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-color: var(--line-strong) transparent;
  }

  #score-view[hidden] { display: none; }
  #score-view::-webkit-scrollbar { height: 8px; }
  #score-view::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }

  /* 楽譜は原寸のまま置く。縮めると SVG の x 座標と画面上の位置がずれる */
  .score-canvas { position: relative; flex: none; }
  .score-canvas svg { display: block; }

  #score-view .note.is-playing {
    --score-ink: var(--accent);
    color: var(--accent);
  }

  .score-playhead {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 2px;
    margin-left: -1px;
    background: var(--accent);
    opacity: 0.8;
    pointer-events: none;
  }

  .score-playhead[hidden] { display: none; }

  .score-empty {
    flex: none;
    margin: auto;
    padding: 20px;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-align: center;
  }

  /* ---- 道具の列 ----
   *
   * 設定・保存・曲コードは、開いたときだけ場所を取る。
   * 常時ぜんぶ並べると、最初の画面が説明文と入力欄で埋まってしまう。
   */
  .tools {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: clamp(16px, 4vw, 24px);
  }

  .tool {
    display: grid;
    justify-items: center;
    gap: 4px;
    flex: 1 1 0;
    min-width: 0;
    padding: 9px 4px;
    color: var(--muted);
    background: transparent;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
  }

  .tool[aria-expanded="true"],
  .tool[aria-pressed="true"] {
    color: var(--text);
    background: var(--surface);
    border-color: var(--line-strong);
  }

  .panel {
    margin-top: 10px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .panel[hidden] { display: none; }

  .panel-note {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.7rem;
    line-height: 1.7;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .row > button { flex: 1 1 auto; min-height: 44px; }

  #song-code {
    flex: 1 1 100%;
    min-width: 0;
    padding: 10px 12px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* 16px を切ると iOS が入力時にページを勝手に拡大する */
    font-size: 16px;
  }

  #song-code::placeholder { color: var(--muted); }

  .icon-btn {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 44px;
    min-height: 44px;
    padding: 0;
    color: var(--muted);
  }

  #status {
    margin-top: 12px;
    min-height: 1.5em;
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    text-align: center;
    overflow-wrap: anywhere;
  }

  /* ---- 設定パネル（src/ui.js が組み立てる） ---- */

  .settings { display: grid; gap: 8px; }

  .settings-pending {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.7rem;
  }

  .settings-pending[hidden] { display: none; }
  .settings-rebuild { padding: 7px 12px; font-size: 0.7rem; background: transparent; }

  /* 見出しの帯は出さない。項目名だけで足りる */
  .settings-group { border: 0; }
  .settings-group-title { display: none; }

  .settings-fields {
    display: grid;
    gap: 14px;
    padding: 0;
  }

  .field { display: grid; gap: 6px; min-width: 0; }

  .field-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .field-label { font-size: 0.875rem; color: var(--muted); }

  .field-value {
    font-size: 0.7rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* 補足は初期表示では出さない。触ったときに要る情報で、常時は雑音になる */
  .field-hint { display: none; }

  .field-range .field-input {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .field-choice .field-input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    /* 16px を切ると iOS が選択時にページを勝手に拡大する */
    font-size: 16px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .settings-footer { display: flex; justify-content: flex-end; }

  .settings-reset {
    min-height: 44px;
    font-size: 0.7rem;
    color: var(--muted);
    background: transparent;
  }

  /* ---- フッタ ---- */

  .site-foot {
    margin-top: clamp(28px, 7vw, 48px);
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.7rem;
    text-align: center;
    letter-spacing: 0.04em;
  }

  .foot-credit {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0 10px;
    margin: 0;
  }

  /* 区切り記号は置かない。折り返したときに行頭や行末へ取り残される */
  .foot-links { gap: 0 18px; }

  .site-foot a {
    display: inline-flex;
    align-items: center;
    /* 指で押せる高さを確保する。文字だけのリンクは狭すぎて外しやすい */
    min-height: 38px;
    color: var(--muted);
    text-decoration-color: var(--line-strong);
    text-underline-offset: 4px;
    transition: color 0.2s ease, text-decoration-color 0.2s ease;
  }

  .site-foot a:hover { color: var(--text); text-decoration-color: var(--accent); }
  .foot-built { margin: 6px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    /* 動きを止めても、再生中であることは光の濃さで分かるようにする */
    body[data-playing="true"] .ambient i { opacity: 0.5; }
  }
</style>
</head>
<body>

<!-- 再生中だけ現れる、ゆっくり漂う光 -->
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="page">

  <header class="site-head">
    <h1>無限ヒーリングピアノ</h1>
  </header>

  <main>

    <section class="stage" aria-label="再生">
      <div class="transport" role="group" aria-label="再生操作">
        <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
        <button id="prev" class="transport-btn" type="button" aria-label="前の曲へ戻る">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M18 5.5v13a1 1 0 0 1-1.55.83L7.5 13.2v5.3a1 1 0 0 1-2 0v-13a1 1 0 0 1 2 0v5.3l8.95-6.13A1 1 0 0 1 18 5.5Z"/>
          </svg>
        </button>

        <button id="play-toggle" class="transport-play" type="button"
                data-state="stopped" aria-pressed="false" aria-label="再生する">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 4.9a1 1 0 0 1 1.53-.85l10.2 6.4a1.12 1.12 0 0 1 0 1.9L9.53 18.75A1 1 0 0 1 8 17.9Z"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="6.5" y="5" width="4" height="14" rx="1.4"/>
            <rect x="13.5" y="5" width="4" height="14" rx="1.4"/>
          </svg>
        </button>

        <button id="next" class="transport-btn" type="button" aria-label="次の曲へ進む">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 5.5v13a1 1 0 0 0 1.55.83l8.95-6.13v5.3a1 1 0 0 0 2 0v-13a1 1 0 0 0-2 0v5.3L7.55 4.67A1 1 0 0 0 6 5.5Z"/>
          </svg>
        </button>
      </div>

      <p id="now-playing" aria-live="polite">再生ボタンで、一曲目が生まれます</p>
    </section>

    <section class="score-section" aria-label="楽譜">
      <div id="score-view" tabindex="0" role="group" aria-label="楽譜（横にスクロールできます）">
        <p class="score-empty">再生すると、ここに楽譜が出ます</p>
      </div>
    </section>

    <nav class="tools" aria-label="道具">
      <button id="score-toggle" class="tool" type="button" aria-pressed="true" aria-controls="score-view">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 6h16M4 10h16M4 14h7M4 18h7"/>
          <circle cx="16" cy="17" r="2.6"/><path d="M18.6 17V9.4l2.4-.8"/>
        </svg>
        楽譜
      </button>

      <button id="tool-settings" class="tool" type="button" aria-expanded="false" aria-controls="panel-settings">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h5M13 12h7"/>
          <circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/><circle cx="11" cy="12" r="2"/>
        </svg>
        設定
      </button>

      <button id="tool-export" class="tool" type="button" aria-expanded="false" aria-controls="panel-export">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3.5v11M8 10.8l4 3.7 4-3.7M4.5 17.5v1.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-1.5"/>
        </svg>
        保存
      </button>

      <button id="tool-code" class="tool" type="button" aria-expanded="false" aria-controls="panel-code">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 4.5 8 19.5M16 4.5l-2 15M4.5 9h15M3.5 15h15"/>
        </svg>
        コード
      </button>
    </nav>

    <div id="panel-settings" class="panel" hidden>
      <div id="settings-panel"></div>
    </div>

    <div id="panel-export" class="panel" hidden>
      <div class="row">
        <button id="export-musicxml" type="button" disabled>MusicXML</button>
        <button id="export-midi" type="button" disabled>MIDI</button>
      </div>
      <p class="panel-note">
        MusicXML は MuseScore などで五線譜として開けます。MIDI は DAW で編集できます。
      </p>
    </div>

    <div id="panel-code" class="panel" hidden>
      <div class="row">
        <input id="song-code" type="text" aria-label="曲コード"
               spellcheck="false" autocomplete="off" autocapitalize="off"
               placeholder="再生するとここに出ます">
        <button id="copy-code" class="icon-btn" type="button" aria-label="曲コードをコピー">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5A1.5 1.5 0 0 0 5.5 15"/>
          </svg>
        </button>
        <button id="load-code" class="icon-btn" type="button" aria-label="曲コードを読み込む">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
